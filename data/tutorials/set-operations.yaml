schema_version: 1
id: set-operations
title: 'Sets: Membership, Algebra, and Deduplication'
summary: Intersect, diff, test subsets and dedupe in order with sets.
tags: [python, sets, membership]
environment: python
order: 5
cells:
  - type: markdown
    text: |
      The **set** gives you O(1) membership tests and the whole vocabulary of intersection and
      difference as operators. It shows up whenever a problem asks "which of these appear in both?",
      "have I seen this already?", or "can this requirement be satisfied?".

      Prefer the operators over loops:

      | Operator | Meaning |
      |---|---|
      | `a & b` | intersection: in both |
      | `a ^ b` | symmetric difference: in exactly one |
      | `a - b` | difference: in `a` but not `b` |
      | `x <= y` | subset test: everything in `x` is in `y` |

      `sorted()` on a set gives a deterministic list. Run the cell to see them.

  - type: code
    id: demo
    starter: |
      a = {"net", "db", "cache"}
      b = {"db", "queue"}
      print("both:", sorted(a & b))
      print("one side only:", sorted(a ^ b))
      print("a minus b:", sorted(a - b))
      print("{'db'} <= a:", {"db"} <= a)

  - type: markdown
    text: |
      **Intersection.** Write `common_tags(a, b)` returning a sorted list of the tags in **both** sets.

      ```python
      common_tags({"net", "db", "cache"}, {"db", "queue"})   # ["db"]
      ```

  - type: code
    id: common
    starter: |
      def common_tags(a, b):
          ...

      common_tags({"net", "db", "cache"}, {"db", "queue"})
    reference: |
      def common_tags(a, b):
          return sorted(a & b)

      common_tags({"net", "db", "cache"}, {"db", "queue"})
    checks:
      - description: only tags present in both sets
        code: assert common_tags({"net", "db", "cache"}, {"db", "queue"}) == ["db"]
      - description: disjoint sets share nothing
        code: assert common_tags({1, 2}, {3, 4}) == []
      - description: identical sets give the whole set, sorted
        code: assert common_tags({2, 1}, {1, 2}) == [1, 2]
      - description: an empty side intersects to nothing
        code: assert common_tags(set(), {1}) == []

  - type: markdown
    text: |
      **Symmetric difference.** Write `exclusive_tags(a, b)` returning a sorted list of the tags in
      **exactly one** of the two sets.

      ```python
      exclusive_tags({"net", "db"}, {"db", "queue"})   # ["net", "queue"]
      ```

  - type: code
    id: exclusive
    starter: |
      def exclusive_tags(a, b):
          ...

      exclusive_tags({"net", "db"}, {"db", "queue"})
    reference: |
      def exclusive_tags(a, b):
          return sorted(a ^ b)

      exclusive_tags({"net", "db"}, {"db", "queue"})
    checks:
      - description: tags in exactly one set
        code: assert exclusive_tags({"net", "db"}, {"db", "queue"}) == ["net", "queue"]
      - description: identical sets cancel out
        code: assert exclusive_tags({1, 2}, {1, 2}) == []
      - description: with one side empty, everything on the other side is exclusive
        code: assert exclusive_tags(set(), {2, 1}) == [1, 2]

  - type: markdown
    text: |
      **Subset.** Write `covers(available, required)` returning `True` if every required tag is
      available. `covers(x, set())` is `True`: nothing required is always covered.

      ```python
      covers({"db", "net"}, {"net"})   # True
      covers({"db", "net"}, {"ui"})    # False
      ```

  - type: code
    id: covers
    starter: |
      def covers(available, required):
          ...

      covers({"db", "net"}, {"net"})
    reference: |
      def covers(available, required):
          return required <= available

      covers({"db", "net"}, {"net"})
    checks:
      - description: everything required is available
        code: assert covers({"db", "net"}, {"net"}) is True
      - description: a missing tag means False
        code: assert covers({"db", "net"}, {"db", "ui"}) is False
      - description: nothing required is always covered
        code: assert covers({"db"}, set()) is True
      - description: a set covers itself
        code: assert covers({1, 2}, {1, 2}) is True
      - description: nothing available cannot cover a requirement
        code: assert covers(set(), {1}) is False

  - type: markdown
    text: |
      **Deduplicate in order.** Write `first_unique_order(items)` removing duplicates from a list while
      keeping the **first** occurrence of each element, in order.

      A set alone loses order, so keep a `seen` set for O(1) lookups plus an output list that
      preserves order. Walk the list once: skip anything already in `seen`, otherwise add it to both.

      Set elements must be hashable (no lists or dicts); that constraint is what buys the O(1) test.

      ```python
      first_unique_order([3, 1, 3, 2, 1])   # [3, 1, 2]
      ```

  - type: code
    id: unique
    starter: |
      def first_unique_order(items):
          ...

      first_unique_order([3, 1, 3, 2, 1])
    reference: |
      def first_unique_order(items):
          seen = set()
          out = []
          for item in items:
              if item not in seen:
                  seen.add(item)
                  out.append(item)
          return out

      first_unique_order([3, 1, 3, 2, 1])
    checks:
      - description: duplicates are dropped and first-seen order is kept
        code: assert first_unique_order([3, 1, 3, 2, 1]) == [3, 1, 2]
      - description: an empty list stays empty
        code: assert first_unique_order([]) == []
      - description: all the same value leaves one copy
        code: assert first_unique_order([7, 7, 7]) == [7]
      - description: strings dedupe the same way
        code: assert first_unique_order(["b", "a", "b", "c"]) == ["b", "a", "c"]
