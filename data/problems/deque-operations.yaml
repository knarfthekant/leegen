    from solution import interleave, last_n, rotate_roster, serve


    class TestRotateRoster:
        """Rotating right by k moves the tail to the front. Also k = 0 (a copy), an empty roster, a negative k (rotates left) and k beyond the length (wraps)."""
        def test_rotate_roster_moves_the_tail_to_the_front(self):
            """Rotate right by 1: the last item moves to the front."""
            assert rotate_roster([1, 2, 3, 4], 1) == [4, 1, 2, 3]


    class TestLastN:
        """The last n items in their original order. Also n = 0, a negative n, and n larger than the list."""
        def test_last_n_keeps_a_window_on_the_tail(self):
            """The last n items, in their original order."""
            assert last_n([1, 2, 3, 4, 5], 2) == [4, 5]


    class TestServe:
        """FIFO service that skips blocked tasks. Also everything blocked, nothing blocked, and no tasks."""
        def test_serve_skips_blocked_tasks_in_fifo_order(self):
            """Blocked tasks are skipped; the rest leave in FIFO order."""
            assert serve(["t1", "t2", "t3"], {"t2"}) == ["t1", "t3"]


    class TestInterleave:
        """Alternating items from two lists until one runs out. Also an empty first side, an empty second side, and both empty."""
        def test_interleave_alternates_until_one_runs_out(self):
            """Alternate items until one side runs out."""
            assert interleave([1, 2, 3], ["a"]) == [1, "a", 2, 3]
