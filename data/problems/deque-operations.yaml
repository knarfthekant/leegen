description: |
  `list.pop(0)` is O(n) - the wrong tool for a queue. `collections.deque`
  (double-ended queue) does both ends in O(1): `popleft()` for FIFO queues,
  `pop()` for stacks, `maxlen` for sliding windows, `rotate()` for circular
  shifts. It is the structure behind BFS, rate limiters and "last N events".

  ## Your task

  Implement four functions in `solution.py`.

  | Function | What it does |
  |---|---|
  | `rotate_roster(names, k)` | Rotate `names` **right** by `k` positions (like `deque.rotate(k)`); return a list. |
  | `last_n(stream, n)` | The last `n` elements of `stream`, in order. `n <= 0` is `[]`; `n` beyond the length returns everything. |
  | `serve(tasks, blocked)` | Process `tasks` FIFO: `popleft()` each task, skip the ones in `blocked`, and return the served tasks in order. |
  | `interleave(a, b)` | Alternate one element from `a`, then one from `b`, until both are exhausted (the longer queue's tail follows). |

  ## Worked example

  ```text
  rotate_roster([1, 2, 3, 4], 1)    ->  [4, 1, 2, 3]
  last_n([1, 2, 3, 4, 5], 2)        ->  [4, 5]
  serve(["t1", "t2", "t3"], {"t2"}) ->  ["t1", "t3"]
  interleave([1, 2, 3], ["a"])      ->  [1, "a", 2, 3]
  ```

  ## Concepts these exercise

  - `deque.rotate(k)` shifts right by `k` in O(k); negative `k` shifts left.
  - `deque(stream, maxlen=n)` keeps only the last `n` items as new ones
    arrive - the sliding-window idiom.
  - `popleft()` is the O(1) queue operation that makes BFS O(n) instead of
    O(n^2) (which is what `list.pop(0)` would cost).
  - Two deques drain independently: the `while qa or qb` loop with two
    guards handles unequal lengths.

  :::note
  Stack or queue? `append` + `pop` is a stack, `append` + `popleft` is a
  queue - same type, opposite ends.
  :::

  **Constraints:** at most 10**5 elements. Every function runs in O(n).
hints:
- '`deque.rotate(k)` does the rotation; just wrap the result in `list(...)`.'
- '`deque(stream, maxlen=n)` discards from the opposite end as items arrive, leaving the last n.'
- '`serve` is `while q: task = q.popleft()`; `interleave` is a loop over `while qa or qb:` with a guard
  per queue.'
