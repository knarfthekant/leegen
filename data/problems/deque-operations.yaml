    from solution import interleave, last_n, rotate_roster, serve


    class TestRotateRoster:
        """Rotating right by k moves the tail to the front. Also k = 0 (a copy), an empty roster, a negative k (rotates left) and k beyond the length (wraps)."""
        def test_rotate_roster_zero_is_a_copy(self):
            """k = 0 returns a new list in the same order, not the input object."""
            src = [1, 2]
            out = rotate_roster(src, 0)
            assert out == [1, 2]
            assert out is not src

        def test_rotate_roster_empty(self):
            """An empty roster stays empty."""
            assert rotate_roster([], 3) == []

        def test_rotate_roster_negative_k_rotates_left(self):
            """A negative k rotates left: -1 moves the first item to the end."""
            assert rotate_roster([1, 2, 3, 4], -1) == [2, 3, 4, 1]

        def test_rotate_roster_k_beyond_length_wraps(self):
            """k larger than the roster wraps around."""
            assert rotate_roster([1, 2, 3], 4) == [3, 1, 2]


    class TestLastN:
        """The last n items in their original order. Also n = 0, a negative n, and n larger than the list."""
        def test_last_n_zero_is_empty(self):
            """n = 0 asks for nothing."""
            assert last_n([1, 2, 3], 0) == []

        def test_last_n_negative_is_empty(self):
            """A negative n asks for nothing."""
            assert last_n([1, 2, 3], -2) == []

        def test_last_n_beyond_length_returns_everything(self):
            """n larger than the list returns everything."""
            assert last_n([1, 2], 10) == [1, 2]


    class TestServe:
        """FIFO service that skips blocked tasks. Also everything blocked, nothing blocked, and no tasks."""
        def test_serve_all_blocked(self):
            """All tasks blocked: nothing is served."""
            assert serve(["t1", "t2"], {"t1", "t2"}) == []

        def test_serve_empty_blocked_set(self):
            """Nothing blocked: everything is served in order."""
            assert serve(["t1"], set()) == ["t1"]

        def test_serve_empty_tasks(self):
            """No tasks, nothing to serve."""
            assert serve([], {"t1"}) == []


    class TestInterleave:
        """Alternating items from two lists until one runs out. Also an empty first side, an empty second side, and both empty."""
        def test_interleave_empty_first(self):
            """An empty first side leaves the second side untouched."""
            assert interleave([], [1, 2]) == [1, 2]

        def test_interleave_empty_second(self):
            """An empty second side leaves the first side untouched."""
            assert interleave([1, 2], []) == [1, 2]

        def test_interleave_both_empty(self):
            """Two empty sides stay empty."""
            assert interleave([], []) == []
