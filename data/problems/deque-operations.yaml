  - path: solution.py
    content: |
      """deque: queues, streams and rotation at both ends."""

      from collections import deque


      def rotate_roster(names: list, k: int) -> list:
          q = deque(names)
          q.rotate(k)
          return list(q)


      def last_n(stream: list, n: int) -> list:
          return list(deque(stream, maxlen=max(n, 0)))


      def serve(tasks: list, blocked: set) -> list:
          q = deque(tasks)
          served = []
          while q:
              task = q.popleft()
              if task in blocked:
                  continue
              served.append(task)
          return served


      def interleave(a: list, b: list) -> list:
          qa, qb = deque(a), deque(b)
          out = []
          while qa or qb:
              if qa:
                  out.append(qa.popleft())
              if qb:
                  out.append(qb.popleft())
          return out
