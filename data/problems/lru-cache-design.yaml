environment: python
description: |
  The capstone: combine what the track built up into a real design question.
  The LRU (least-recently-used) cache is *the* interview question about data
  structures - it asks which structure makes both operations O(1), and the
  answer is "a hash map glued to a doubly linked list" - or Python's
  `collections.OrderedDict`, which already is exactly that.

  ## Your task

  Implement an `LRUCache` class in `solution.py`:

  - `LRUCache(capacity)` - construct with a positive capacity.
  - `get(key)` - return the value for `key`, or `-1` if absent. A successful
    get counts as a **use** of the key.
  - `put(key, value)` - insert or update `key`. Insertion and update both
    count as a **use**. When the cache exceeds `capacity`, evict the
    **least recently used** key. Returns `None`.

  Both operations must be **O(1)** average time.

  ## Worked example

  ```text
  cache = LRUCache(2)
  cache.put(1, 10)     # {1: 10}
  cache.put(2, 20)     # {1: 10, 2: 20}
  cache.get(1)  -> 10  # 1 is now most recently used
  cache.put(3, 30)     # evicts 2  ->  {3: 30, 1: 10}
  cache.get(2)  -> -1  # evicted
  cache.get(3)  -> 30
  ```

  ## The data-structure reasoning

  You need O(1) lookup (a hash map) **and** an O(1) record of usage order
  (a linked list). Options:

  1. `collections.OrderedDict` - a dict that remembers insertion order and
     offers `move_to_end(key)` and `popitem(last=False)`. Both operations
     become a few lines.
  2. A plain `dict` + a list of keys - the list makes eviction O(n). Wrong
     tool; feel the difference.
  3. Hand-rolled hash map + doubly linked list - what OrderedDict does
     internally, and what you'd build in a language without it.

  :::tip
  Python dicts preserve insertion order too, so a plain dict can work: on a
  get, `del d[key]` then re-insert to move the key to the end, and evict with
  `next(iter(d))`. OrderedDict's `move_to_end` is just the O(1) spelling of
  the same idea.
  :::

  **Constraints:** `1 <= capacity <= 3000`; at most 10^4 calls total; keys
  and values are ints.
hints:
- 'OrderedDict gives you the whole machine: `move_to_end(key)` marks a use; `popitem(last=False)` evicts
  the LRU end.'
- On `put` of an existing key, refresh its position (move_to_end) *before* overwriting - update counts
  as a use.
- Evict only when the size exceeds capacity, and check it after the insertion, not before.
