sections:
- id: examples
  title: Worked examples
  description: The statement's three examples. `get(1)` makes 1 the most recent, so `put(3)` evicts 2. A `get` on a missing key is `-1`. Putting an existing key again refreshes it.
- id: eviction
  title: Eviction order
  description: Which key leaves when the cache fills, and what counts as a use.
- id: edge-cases
  title: Edge cases
  description: Keys and values the cache must treat like any other, such as negative ints.
