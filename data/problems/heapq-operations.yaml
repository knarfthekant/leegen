        """Merging sorted streams into one sorted stream. Also no streams, empty streams, and a single stream returned as given."""
        def test_merge_streams_empty_outer_list(self):
            """No streams, nothing to merge."""
            assert merge_streams([]) == []

        def test_merge_streams_with_empty_sublists(self):
            """Empty streams contribute nothing."""
            assert merge_streams([[], [1, 2], []]) == [1, 2]

        def test_merge_streams_single_stream_is_returned_in_given_order(self):
            """A single stream is returned as given, not re-sorted."""
            assert merge_streams([[3, 1, 2]]) == [3, 1, 2]


