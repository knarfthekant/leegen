description: |
  A heap answers "what is the smallest (or largest) thing right now?" in O(log n)
  and gives you the top-k of a large stream without sorting it. Python's `heapq`
  module is a **min-heap**: `heap[0]` is always the smallest element. Coding
  questions use it for schedulers, Dijkstra, k-way merges and every "k closest /
  k largest" problem.

  ## Your task

  Implement four functions in `solution.py`.

  | Function | What it does |
  |---|---|
  | `top_k(scores, k)` | The `k` largest scores, largest first. `k <= 0` is `[]`. |
  | `cheapest_k(prices, k)` | The `k` smallest prices, smallest first. `k <= 0` is `[]`. |
  | `merge_streams(streams)` | Merge pre-sorted lists into one sorted list (k-way merge). `merge_streams([])` is `[]`. |
  | `combine_ropes(lengths)` | Repeatedly join the two shortest ropes; each join costs the sum of the two lengths. Return the **minimum total cost**. Fewer than two ropes costs 0. |

  ## Worked example

  ```text
  top_k([72, 95, 88, 61], 2)         ->  [95, 88]
  cheapest_k([7, 10, 4, 3, 20], 3)   ->  [3, 4, 7]
  merge_streams([[1, 4], [1, 3], [2, 6]])
                                     ->  [1, 1, 2, 3, 4, 6]
  combine_ropes([4, 3, 2, 6])        ->  29
      # 2+3=5 (cost 5), 5+4=9 (cost 9), 9+6=15 (cost 15); total 5+9+15 = 29
  ```

  ## Concepts these exercise

  - `heapq.nlargest(k, xs)` / `heapq.nsmallest(k, xs)` - top-k without
    writing a heap; both return sorted results.
  - `heapq.merge(*streams)` lazily merges any number of sorted inputs.
  - The manual pattern every scheduler uses: `heapify` once, then loop
    `heappop` (the work), `heappush` (the follow-up).

  :::warning
  `heapq` is a min-heap. To get "largest first" out of it, push negated
  values, or use `nlargest`. Also note `nlargest`/`nsmallest` **return a
  new sorted list**, while `heappush`/`heappop` mutate the heap in place -
  and `heapify` turns an existing list into a heap in place.
  :::

  **Constraints:** at most 10**5 elements; rope lengths are positive ints
  fitting in 64 bits. `top_k`/`cheapest_k` are O(n log k); `combine_ropes` is
  O(n log n).
hints:
- 'Top-k one-liners: `heapq.nlargest(k, scores)` and `heapq.nsmallest(k, prices)` - both already return
  sorted lists.'
- '`heapq.merge(*streams)` takes each list as a separate argument - unpack with the star.'
- '`combine_ropes`: `heapify`, then while more than one rope remains, pop two, add their sum to the total,
  and push the sum back.'
