        """Always combine the two cheapest ropes and sum every cost. Also fewer than two ropes, two ropes, and why greedy beats left to right."""
        def test_combine_ropes_fewer_than_two_ropes(self):
            """Fewer than two ropes cost nothing."""
            assert combine_ropes([]) == 0
            assert combine_ropes([7]) == 0

        def test_combine_ropes_two_ropes_cost_their_sum(self):
