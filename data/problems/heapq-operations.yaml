  files:
  - path: solution.py
    content: |
      """heapq: priority queues and the top-k family."""

      import heapq


      def top_k(scores: list, k: int) -> list:
          return heapq.nlargest(max(k, 0), scores)


      def cheapest_k(prices: list, k: int) -> list:
          return heapq.nsmallest(max(k, 0), prices)


      def merge_streams(streams: list) -> list:
          if not streams:
              return []
          return list(heapq.merge(*streams))


      def combine_ropes(lengths: list) -> int:
          if len(lengths) < 2:
              return 0
          heap = list(lengths)
          heapq.heapify(heap)
          total = 0
          while len(heap) > 1:
              a = heapq.heappop(heap)
              b = heapq.heappop(heap)
              total += a + b
              heapq.heappush(heap, a + b)
          return total
