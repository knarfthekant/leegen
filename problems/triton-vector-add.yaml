schema_version: 1
id: triton-vector-add
title: Your First Triton Kernel
difficulty: intro
tags: [triton, gpu, kernels]
track: triton-101
order: 1
environment: triton
requires: [cuda]
description: |
  [Triton](https://triton-lang.org) lets you write GPU kernels in Python. You don't program
  individual threads as in CUDA. Each **program instance** processes a whole **block** of
  elements with vectorised loads and stores.

  ```python
  @triton.jit
  def kernel(x_ptr, ..., n, BLOCK: tl.constexpr):
      pid = tl.program_id(axis=0)                 # which block am I?
      offs = pid * BLOCK + tl.arange(0, BLOCK)    # the BLOCK indices this program owns
      mask = offs < n                             # the last block may run past the end
      x = tl.load(x_ptr + offs, mask=mask)
      ...
  ```

  The launch grid says how many program instances run: $\lceil n / \text{BLOCK} \rceil$ for a
  1-D problem, written `triton.cdiv(n, BLOCK)`.

  ### Your task

  Complete `solution.py`:

  1. `add_kernel`: each program loads its block of `x` and `y` (masked), adds them, and stores
     the result to `out`.
  2. `add(x, y)`: allocate `out = torch.empty_like(x)`, launch `add_kernel` over a 1-D grid
     with `BLOCK=1024`, and return `out`.

  Inputs are 1-D `float32` CUDA tensors of the same length, which may not be a multiple of the
  block size.

  :::note
  The point is the kernel. Computing `x + y` in PyTorch would pass the tests, but you'd learn
  nothing. Ask your AI assistant to review your kernel once it passes.
  :::
hints:
  - "`offs = pid * BLOCK + tl.arange(0, BLOCK)` and `mask = offs < n`; pass `mask=mask` to both `tl.load` and `tl.store`."
  - "Launch with `add_kernel[(triton.cdiv(n, 1024),)](x, y, out, n, BLOCK=1024)`."
