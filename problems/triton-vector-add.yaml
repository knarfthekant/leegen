  - path: _setup.py
    role: hidden
    content: |
      import torch

      from leetclaude_harness import device


      def pair(seed: int, n: int):
          g = torch.Generator().manual_seed(seed)
          return [torch.randn(n, generator=g).to(device()), torch.randn(n, generator=g).to(device())]
reference:
  files:
    - path: solution.py
      content: |
        import torch
        import triton
        import triton.language as tl


        @triton.jit
        def add_kernel(x_ptr, y_ptr, out_ptr, n, BLOCK: tl.constexpr):
            pid = tl.program_id(axis=0)
            offs = pid * BLOCK + tl.arange(0, BLOCK)
            mask = offs < n
            x = tl.load(x_ptr + offs, mask=mask)
            y = tl.load(y_ptr + offs, mask=mask)
            tl.store(out_ptr + offs, x + y, mask=mask)


        def add(x: torch.Tensor, y: torch.Tensor) -> torch.Tensor:
            out = torch.empty_like(x)
            n = out.numel()
            add_kernel[(triton.cdiv(n, 1024),)](x, y, out, n, BLOCK=1024)
            return out
judge:
  kind: function
  entry: solution.py:add
  params: [x, y]
  compare: {kind: allclose, rtol: 1.0e-6, atol: 1.0e-6}
tests:
  - name: One block (n = 1024)
    input: {gen: _setup.py:pair, seed: 0, kwargs: {n: 1024}}
  - name: Partial block (n = 1000)
    input: {gen: _setup.py:pair, seed: 1, kwargs: {n: 1000}}
  - name: Single element
    visible: false
    input: {gen: _setup.py:pair, seed: 2, kwargs: {n: 1}}
  - name: Many blocks, ragged end
    visible: false
    input: {gen: _setup.py:pair, seed: 3, kwargs: {n: 1000003}}
limits: {timeout_s: 120}
