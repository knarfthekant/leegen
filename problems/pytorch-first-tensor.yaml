- path: _setup.py
  role: hidden
  content: |
    import torch

    from leegen_harness import device


    def make_inputs(seed, x, weight, bias):
        dev = device()
        return {
            "x": torch.tensor(x, dtype=torch.float32, device=dev),
            "weight": torch.tensor(weight, dtype=torch.float32, device=dev),
            "bias": torch.tensor(bias, dtype=torch.float32, device=dev),
        }
reference:
  files:
  - path: solution.py
    content: |
      import torch


      def linear_relu(
          x: torch.Tensor,
          weight: torch.Tensor,
          bias: torch.Tensor,
      ) -> torch.Tensor:
          return torch.relu(x @ weight.T + bias)
judge:
  kind: function
  entry: solution.py:linear_relu
  params:
  - x
  - weight
  - bias
  compare:
    kind: allclose
    rtol: 0.0001
    atol: 1.0e-05
tests:
- name: Mixed activations in a batch
  description: Each row uses the same weight matrix, bias broadcasts, and negative outputs become zero.
  input:
    kwargs:
      x:
      - - 1
        - 2
      - - -1
        - 3
      weight:
      - - 1
        - -1
      - - 2
        - 1
      - - 0.5
        - 0.5
      bias:
      - 0
      - 0.5
      - -2
    gen: _setup.py:make_inputs
  expected:
  - - 0
    - 4.5
    - 0
  - - 0
    - 1.5
    - 0
- name: One input row and two output features
  description: Matrix multiplication works when the batch has one row and output width differs from input
    width.
  input:
    kwargs:
      x:
      - - 2
        - 0
        - -1
      weight:
      - - 1
        - 0
        - 1
      - - -1
        - 2
        - 0
      bias:
      - 0.5
      - -1
    gen: _setup.py:make_inputs
  expected:
  - - 1.5
    - 0
- name: Single output feature
  visible: false
  description: The output keeps both batch and feature dimensions when there is one output feature.
  input:
    kwargs:
      x:
      - - -2
        - 1
      - - 3
        - -1
      - - 0
        - 0
      weight:
      - - 2
        - 1
      bias:
      - -1
    gen: _setup.py:make_inputs
  expected:
  - - 0
  - - 4
  - - 0
- name: Bias turns a negative product positive
  visible: false
  description: Add bias before ReLU so a negative matrix product can become positive.
  input:
    kwargs:
      x:
      - - -2
        - 1
      - - 1
        - 1
      weight:
      - - 1
        - -1
      - - -1
        - -1
      bias:
      - 3
      - 0
    gen: _setup.py:make_inputs
  expected:
  - - 0
    - 1
  - - 3
    - 0
limits:
  timeout_s: 60.0
