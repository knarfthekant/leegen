schema_version: 1
id: pytorch-first-tensor
title: Build a Small Neural Network Layer
difficulty: easy
tags:
- pytorch
- tensors
- matrix-multiplication
- gpu
track: pytorch-101
order: 1
environment: pytorch
requires:
- gpu
description: |
  A neural network layer combines a matrix multiplication, a bias, and an activation function.
  The test setup supplies small float32 tensors on the available GPU backend (CUDA on NVIDIA or
  MPS on Apple silicon), so you can focus on how PyTorch combines tensors of different shapes.

  ### Your task

  Implement `linear_relu(x, weight, bias)` for a batch of input rows:

  - `x` has shape `[batch, in_features]`.
  - `weight` has shape `[out_features, in_features]`.
  - `bias` has shape `[out_features]`.
  - Return a tensor with shape `[batch, out_features]` on the same device and with the same
    dtype as `x`.

  For each input row, compute a linear transformation and then apply ReLU:

  $$y = \operatorname{ReLU}(x W^\top + b)$$

  ReLU replaces negative values with zero. For example:

  ```text
  x      = [[1, 2], [-1, 3]]
  weight = [[1, -1], [2, 1], [0.5, 0.5]]
  bias   = [0, 0.5, -2]

  output = [[0, 4.5, 0],
            [0, 1.5, 0]]
  ```

  In PyTorch, `@` performs matrix multiplication, `.T` transposes a 2D tensor, and adding
  `bias` broadcasts its values across all rows. `torch.relu(...)` applies the activation.
  The inputs are already tensors on the right device; preserve that device instead of moving
  data to the CPU.

  **Constraints:** `1 <= batch <= 16`, `1 <= in_features <= 32`, and
  `1 <= out_features <= 32`. All tensors contain finite float32 values.
hints:
- 'Check the shapes: the last dimension of x must match the last dimension of weight.'
- Transpose weight so its shape is [in_features, out_features] before multiplying by x.
- Add bias to the matrix product; PyTorch broadcasts [out_features] across the batch. Then apply torch.relu.
