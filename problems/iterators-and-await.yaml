      import asyncio
      from typing import AsyncIterator, Iterable, Iterator, Protocol, TypeVar

      T = TypeVar("T")


      class Connection(Protocol):
          async def readline(self) -> str | None: ...
          def close(self) -> None: ...


      class Peekable:
          """A sync iterator that can look one step ahead without consuming."""

          def __init__(self, items: Iterable[T]) -> None:
              raise NotImplementedError

          def __iter__(self) -> "Peekable":
              raise NotImplementedError

          def __next__(self) -> T:
              raise NotImplementedError

          def peek(self) -> T:
              raise NotImplementedError


      def take(items: Iterable[T], k: int) -> Iterator[T]:
          """Yield at most k items from items, reading lazily."""
          raise NotImplementedError
          yield  # keep this a generator function


      async def fair_countdown(n: int) -> AsyncIterator[int]:
          """Yield n, n-1, ..., 1, awaiting asyncio.sleep(0) before EACH item."""
          raise NotImplementedError
          yield


      async def burst(n: int) -> AsyncIterator[int]:
          """Yield n, n-1, ..., 1 with no await at all. Used as the control group."""
          raise NotImplementedError
          yield


      async def drain(conn: Connection) -> AsyncIterator[str]:
          """Yield stripped non-empty lines, closing conn exactly once."""
          raise NotImplementedError
          yield
  - path: test_visible.py
    role: readonly
    content: |
      """Visible tests, one worked example per question type.

      The five question types are declared as pytest classes, so the run results show
      them as collapsible section headers instead of one flat list:

          1. TestValuesAndOrder    does it produce the right items, in order?
          2. TestIteratorProtocol  is it really an iterator - iter(), peek(), StopIteration?
          3. TestLaziness          is anything read before it is asked for?
          4. TestTaskSuspension    does an await hand the loop a turn?
          5. TestCleanup           does close() run on every exit path?

      `TestTaskSuspension` gets a deliberately weak example: it only checks that the
      other task ran before the first item. The exact interleaving is graded in
      test_hidden.py.
      """

      import asyncio

      from solution import Peekable, burst, drain, fair_countdown, take


      # ---------------------------------------------------------------------------
      # Helpers - also imported by test_hidden.py
      # ---------------------------------------------------------------------------


      class FakeConn:
          """An async line source that counts how many times it was closed."""

          def __init__(self, lines):
              self.lines = list(lines)
              self.closed = 0

          async def readline(self):
              await asyncio.sleep(0)
              return self.lines.pop(0) if self.lines else None

          def close(self):
              self.closed += 1


      class LogSource:
          """A one-shot iterator that records every time it is stepped."""

          def __init__(self, items, log):
              self._it = iter(items)
              self.log = log

          def __iter__(self):
              return self

          def __next__(self):
              self.log.append("step")
              return next(self._it)


      async def collect(agen):
          """Drain an async generator into a list."""
          return [x async for x in agen]


      # ---------------------------------------------------------------------------
      # 1. Values and order
      # ---------------------------------------------------------------------------


      class TestValuesAndOrder:
          """Does it produce the right items, in the right order?"""

          async def test_fair_countdown_values(self):
              """fair_countdown(n) yields n, n-1, ..., 1"""
              assert await collect(fair_countdown(3)) == [3, 2, 1]

          async def test_burst_values(self):
              """burst(n) yields the same values; only *when* they arrive differs"""
              assert await collect(burst(3)) == [3, 2, 1]


      # ---------------------------------------------------------------------------
      # 2. Iterator protocol
      # ---------------------------------------------------------------------------


      class TestIteratorProtocol:
          """Is it really an iterator - iter(), peek(), StopIteration?"""

          def test_peekable_peek_lookahead(self):
              """peek() shows the next item without consuming it"""
              p = Peekable([1, 2])
              assert iter(p) is p
              assert p.peek() == 1
              assert p.peek() == 1
              assert next(p) == 1
              assert next(p) == 2


      # ---------------------------------------------------------------------------
      # 3. Laziness
      # ---------------------------------------------------------------------------


      class TestLaziness:
          """Is anything read before it is asked for?"""

          def test_take_is_lazy(self):
              """take() reads nothing until the first next()"""
              log = []

              def source():
                  for i in [1, 2, 3]:
                      log.append("read")
                      yield i

              g = take(source(), 2)
              assert log == []
              assert next(g) == 1
              assert log == ["read"]


      # ---------------------------------------------------------------------------
      # 4. Task suspension
      # ---------------------------------------------------------------------------


      class TestTaskSuspension:
          """Does an await hand the event loop a turn?"""

          async def test_await_lets_the_other_task_run_first(self):
              """the first value arrives only after another task has had a turn

              Deliberately weaker than the hidden tests: this only checks that the
              other task ran *before* the first item. The exact interleaving for both
              countdowns is what the hidden tests grade - see the description's
              "Worked example" for the full expected order.
              """
              seen = []

              async def other():
                  seen.append("other")
                  await asyncio.sleep(0)

              async def consume():
                  async for n in fair_countdown(3):
                      seen.append(n)

              await asyncio.gather(consume(), other())
              assert seen.index("other") < seen.index(3)


      # ---------------------------------------------------------------------------
      # 5. Cleanup
      # ---------------------------------------------------------------------------


      class TestCleanup:
          """Does close() run on every exit path, exactly once?"""

          async def test_drain_strips_and_closes(self):
              """drain() strips, skips blanks, and closes the connection"""
              conn = FakeConn([" a \n", "\n", "b\n"])
              assert await collect(drain(conn)) == ["a", "b"]
              assert conn.closed == 1
  - path: test_hidden.py
    role: hidden
    content: |
      """Hidden tests, grouped under the same five declared classes.

      Same five classes, same order, harder cases: the easy case first, then the
      boundary, then the exhaustion or error path. A failing section therefore points
      at one concept rather than one function.
      """

      import asyncio
      import inspect

      import pytest

      from solution import Peekable, burst, drain, fair_countdown, take
      from test_visible import FakeConn, LogSource, collect


      # ---------------------------------------------------------------------------
      # 1. Values and order
      # ---------------------------------------------------------------------------


      class TestValuesAndOrder:
          """Does it produce the right items, in the right order?"""

          async def test_countdowns_agree_on_values(self):
              """both countdowns produce identical values"""
              assert await collect(fair_countdown(4)) == [4, 3, 2, 1]
              assert await collect(burst(4)) == [4, 3, 2, 1]

          async def test_zero_yields_nothing(self):
              """countdown(0) yields nothing in either version"""
              assert await collect(fair_countdown(0)) == []
              assert await collect(burst(0)) == []

          def test_take_more_than_available(self):
              """asking for more than exists stops early instead of raising"""
              assert list(take(iter([1, 2]), 5)) == [1, 2]


      # ---------------------------------------------------------------------------
      # 2. Iterator protocol
      # ---------------------------------------------------------------------------


      class TestIteratorProtocol:
          """Is it really an iterator - iter(), peek(), StopIteration?"""

          def test_peekable_is_its_own_iterator(self):
              """iter(p) is p, as the protocol requires"""
              p = Peekable([1])
              assert iter(p) is p

          def test_peekable_one_shot_source(self):
              """works over a one-shot generator, not just a list"""
              p = Peekable(c for c in "abc")
              assert p.peek() == "a"
              assert next(p) == "a"
              assert next(p) == "b"
              assert p.peek() == "c"

          def test_peekable_exhausted_stays_exhausted(self):
              """peek() and next() raise StopIteration forever once empty"""
              p = Peekable([])
              with pytest.raises(StopIteration):
                  p.peek()
              with pytest.raises(StopIteration):
                  p.peek()
              with pytest.raises(StopIteration):
                  next(p)

          def test_all_functions_are_generators(self):
              """each function uses the right kind of suspension"""
              assert inspect.isgeneratorfunction(take)
              assert inspect.isasyncgenfunction(fair_countdown)
              assert inspect.isasyncgenfunction(burst)
              assert inspect.isasyncgenfunction(drain)


      # ---------------------------------------------------------------------------
      # 3. Laziness
      # ---------------------------------------------------------------------------


      class TestLaziness:
          """Is anything read before it is asked for?"""

          def test_take_zero_touches_nothing(self):
              """k <= 0 yields nothing and never steps the source"""
              log = []
              assert list(take(LogSource([1, 2], log), 0)) == []
              assert log == []

          def test_peekable_does_not_read_ahead_twice(self):
              """peeking twice steps the source only once"""
              log = []
              p = Peekable(LogSource([1, 2], log))
              p.peek()
              p.peek()
              assert log == ["step"]

          def test_take_caller_runs_between_resumes(self):
              """one next() steps the source exactly once, then returns to the caller"""
              log = []
              g = take(LogSource([1, 2, 3], log), 3)
              log.append(f"got {next(g)}")
              log.append(f"got {next(g)}")
              log.append(f"got {next(g)}")
              assert log == ["step", "got 1", "step", "got 2", "step", "got 3"]

          def test_take_leaves_the_rest_of_the_source(self):
              """taking exactly k leaves the rest of the source unread"""
              log = []
              src = LogSource([1, 2, 3, 4], log)
              assert list(take(src, 2)) == [1, 2]
              assert log == ["step", "step"]
              assert list(src) == [3, 4]


      # ---------------------------------------------------------------------------
      # 4. Task suspension
      # ---------------------------------------------------------------------------


      async def trace(factory, turns=3):
          """Run factory() alongside one other task that takes `turns` turns.

          The returned log is the whole point: it shows *when* each value arrived
          relative to the other task, which a values-only check cannot see.
          """
          seen = []

          async def other():
              for _ in range(turns):
                  seen.append("other")
                  await asyncio.sleep(0)

          async def consume():
              async for n in factory():
                  seen.append(n)

          await asyncio.gather(consume(), other())
          return seen


      class TestTaskSuspension:
          """Does an await hand the event loop a turn?"""

          async def test_fair_countdown_gates_every_item(self):
              """every item waits for another task to get a turn"""
              assert await trace(lambda: fair_countdown(3)) == ["other", 3, "other", 2, "other", 1]

          async def test_burst_has_no_suspension_point(self):
              """a generator with no await drains in one task step"""
              assert await trace(lambda: burst(3)) == [3, 2, 1, "other", "other", "other"]


      # ---------------------------------------------------------------------------
      # 5. Cleanup
      # ---------------------------------------------------------------------------


      class TestCleanup:
          """Does close() run on every exit path, exactly once?"""

          async def test_drain_empty_closes_once(self):
              """an empty connection yields nothing and still closes"""
              conn = FakeConn([])
              assert await collect(drain(conn)) == []
              assert conn.closed == 1

          async def test_drain_skips_blank_lines(self):
              """whitespace-only lines are skipped"""
              conn = FakeConn(["   \n", "\tx\n", " y \n"])
              assert await collect(drain(conn)) == ["x", "y"]

          async def test_drain_early_break_closes_once(self):
              """breaking early still closes the connection exactly once"""
              conn = FakeConn(["one", "two", "three"])
              gen = drain(conn)
              async for _ in gen:
                  break
              await gen.aclose()
              assert conn.closed == 1

          async def test_drain_error_closes_once(self):
              """a readline() error closes the connection and propagates"""

              class Broken(FakeConn):
                  async def readline(self):
                      raise ConnectionError("reset")

              conn = Broken([])
              with pytest.raises(ConnectionError):
                  await collect(drain(conn))
              assert conn.closed == 1

