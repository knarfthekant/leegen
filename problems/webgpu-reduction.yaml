schema_version: 1
id: webgpu-reduction
title: "WebGPU 2: Workgroup Reduction"
difficulty: medium
tags: [webgpu, wgsl, gpu, reduction, shared-memory]
track: webgpu-101
order: 2
environment: webgpu
requires: [webgpu]
description: |
  Sum a large array on the GPU. One invocation per element can't add everything up on its own,
  so each **workgroup** reduces its 256 elements to one partial sum. The host then adds the
  partial sums.

  Write the kernel so that workgroup $w$ stores the sum of elements
  $256w \ldots 256w + 255$ (only those below $n$) in `partials[w]`.

  ### Tree reduction in workgroup memory

  `var<workgroup>` memory is shared by the invocations of one workgroup and is much faster than
  storage buffers. Load one element per invocation into `tile`, then halve the active range
  until one value is left:

  ```mermaid
  flowchart TB
      L["load: tile[l] = data[i] (0 when i >= n)"] --> B1[workgroupBarrier]
      B1 --> S1["stride 128: tile[l] += tile[l + 128] for l < 128"]
      S1 --> B2[workgroupBarrier]
      B2 --> S2["stride 64, 32, ... 1 (a barrier after each step)"]
      S2 --> W["l == 0: partials[w] = tile[0]"]
  ```

  Every step reads values that other invocations wrote in the step before, so there must be a
  `workgroupBarrier()` between steps. Without it the result depends on timing, which is the
  hardest kind of bug to see.

  :::note
  **If you know CUDA:** `var<workgroup>` is `__shared__` memory and `workgroupBarrier()` is
  `__syncthreads()`. As in CUDA, a barrier must be reached by every invocation of the workgroup,
  so don't put it inside an `if` that depends on `local_invocation_id`. WGSL rejects that at
  compile time (uniformity analysis).
  :::

  ### Bindings

  | Binding | Variable | Contents |
  |---|---|---|
  | 0 | `data: array<f32>` (read) | the input |
  | 1 | `partials: array<f32>` (read_write) | one slot per workgroup: $\lceil n / 256 \rceil$ |
  | 2 | `n: u32` (uniform) | number of valid elements in `data` |

  The host returns the sum of `partials` as one number. It is compared with a relative tolerance,
  because float addition in a different order gives slightly different results.

  ### Example

  ```text
  data = [1, 2, 3, 4]   ->   10
  ```
hints:
  - "Each invocation first writes one value into `tile[lid.x]`: `data[gid.x]`, or 0 past `n`."
  - "Loop `for (var s = 128u; s > 0u; s = s / 2u)`: add `tile[lid.x + s]` into `tile[lid.x]` when `lid.x < s`."
  - "Put `workgroupBarrier()` after the load and after every step of the loop, outside the `if`. Invocation 0 writes `partials[wid.x]`."
files:
  - path: kernel.wgsl
    role: editable
    content: |
      @group(0) @binding(0) var<storage, read> data: array<f32>;
      @group(0) @binding(1) var<storage, read_write> partials: array<f32>;
      @group(0) @binding(2) var<uniform> n: u32;

      const WG: u32 = 256u;
      var<workgroup> tile: array<f32, 256>;

      @compute @workgroup_size(256)
      fn main(@builtin(global_invocation_id) gid: vec3<u32>,
              @builtin(local_invocation_id) lid: vec3<u32>,
              @builtin(workgroup_id) wid: vec3<u32>) {
          // TODO: load, reduce in `tile` with barriers, then write partials[wid.x].
      }
  - path: _host.py
    role: hidden
    content: |
      from leetclaude_harness import webgpu as wg

      def total(values):
          n = len(values)
          groups = wg.groups(n, 256)
          out = wg.dispatch(
              wg.source("kernel.wgsl", __file__),
              [wg.storage(wg.f32(values)), wg.storage(size=4 * groups, read_only=False),
               wg.uniform(wg.u32([n, 0, 0, 0]))],
              workgroups=(groups,),
          )
          return sum(wg.to_f32(out[1], groups))
  - path: _gen.py
    role: hidden
    content: |
      import random

      def ones(seed: int, n: int):
          return [[1.0] * n]

      def values(seed: int, n: int, lo: float = -1.0, hi: float = 1.0):
          rng = random.Random(seed)
          return [[rng.uniform(lo, hi) for _ in range(n)]]
reference:
  files:
    - path: kernel.wgsl
      content: |
        @group(0) @binding(0) var<storage, read> data: array<f32>;
        @group(0) @binding(1) var<storage, read_write> partials: array<f32>;
        @group(0) @binding(2) var<uniform> n: u32;

        const WG: u32 = 256u;
        var<workgroup> tile: array<f32, 256>;

        @compute @workgroup_size(256)
        fn main(@builtin(global_invocation_id) gid: vec3<u32>,
                @builtin(local_invocation_id) lid: vec3<u32>,
                @builtin(workgroup_id) wid: vec3<u32>) {
            var v = 0.0;
            if (gid.x < n) {
                v = data[gid.x];
            }
            tile[lid.x] = v;
            workgroupBarrier();
            for (var s = WG / 2u; s > 0u; s = s / 2u) {
                if (lid.x < s) {
                    tile[lid.x] += tile[lid.x + s];
                }
                workgroupBarrier();
            }
            if (lid.x == 0u) {
                partials[wid.x] = tile[0];
            }
        }
judge:
  kind: function
  entry: _host.py:total
  params: [values]
  compare: {kind: float, rtol: 1.0e-4, atol: 1.0e-2}
sections:
  - id: basics
    title: Basics
    description: Small inputs inside one workgroup.
  - id: boundaries
    title: Workgroup boundaries
    description: Lengths that leave a partial last workgroup; invocations past n must add 0.
  - id: scale
    title: Scale
    description: Many workgroups, checked against the reference kernel.
tests:
  - name: Example
    section: basics
    description: The example from the statement.
    input: {args: [[1, 2, 3, 4]]}
    expected: 10
  - name: Full workgroup of ones
    section: basics
    description: 256 ones, exactly one workgroup.
    input: {gen: _gen.py:ones, kwargs: {n: 256}}
    expected: 256
  - name: Single value
    section: basics
    visible: false
    input: {args: [[-7.5]]}
    expected: -7.5
  - name: One past a workgroup
    section: boundaries
    visible: false
    description: 257 elements; the second workgroup has one valid element.
    input: {gen: _gen.py:values, seed: 1, kwargs: {n: 257}}
  - name: Ragged length
    section: boundaries
    visible: false
    input: {gen: _gen.py:values, seed: 2, kwargs: {n: 1000, lo: 0.0, hi: 2.0}}
  - name: Many workgroups
    section: scale
    visible: false
    description: 1,000,000 elements, 3,907 workgroups.
    input: {gen: _gen.py:values, seed: 3, kwargs: {n: 1000000, lo: 0.0, hi: 1.0}}
limits: {timeout_s: 30}
