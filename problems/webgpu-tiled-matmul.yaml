  - path: kernel.wgsl
    role: editable
    content: |
      struct Dims { m: u32, k: u32, n: u32, _pad: u32 }

      @group(0) @binding(0) var<storage, read> a: array<f32>;
      @group(0) @binding(1) var<storage, read> b: array<f32>;
      @group(0) @binding(2) var<storage, read_write> c: array<f32>;
      @group(0) @binding(3) var<uniform> dims: Dims;

      const TILE: u32 = 16u;
      var<workgroup> tile_a: array<array<f32, 16>, 16>;
      var<workgroup> tile_b: array<array<f32, 16>, 16>;

      @compute @workgroup_size(16, 16)
      fn main(@builtin(global_invocation_id) gid: vec3<u32>,
              @builtin(local_invocation_id) lid: vec3<u32>) {
          let row = gid.y;
          let col = gid.x;
          // TODO: c[row * dims.n + col] = sum over i of a[row * dims.k + i] * b[i * dims.n + col]
      }
  - path: _host.py
    role: hidden
    content: |
      from pathlib import Path

      from leegen_harness import webgpu as wg
      from leegen_harness.protocol import emit

      def matmul(a, b):
          m, k, n = len(a), len(b), len(b[0])
          flat_a = [x for row in a for x in row]
          flat_b = [x for row in b for x in row]
          big = m * n >= 256 * 256
          out = wg.dispatch(
              wg.source("kernel.wgsl", __file__),
              [wg.storage(wg.f32(flat_a)), wg.storage(wg.f32(flat_b)),
               wg.storage(size=4 * m * n, read_only=False), wg.uniform(wg.u32([m, k, n, 0]))],
              workgroups=(wg.groups(n, 16), wg.groups(m, 16)),
              timed=big,
          )
          if big and wg.last_gpu_ms is not None and Path(__file__).parent.name != "ref":
              emit({"type": "metric", "name": f"kernel time {m}x{k}x{n}", "value": round(wg.last_gpu_ms, 3),
                    "unit": "ms", "reference": None})
          c = wg.to_f32(out[2], m * n)
          return [c[r * n:(r + 1) * n] for r in range(m)]
  - path: _gen.py
    role: hidden
    content: |
      import random

      def matrices(seed: int, m: int, k: int, n: int):
          rng = random.Random(seed)
          a = [[rng.uniform(-1, 1) for _ in range(k)] for _ in range(m)]
          b = [[rng.uniform(-1, 1) for _ in range(n)] for _ in range(k)]
          return [a, b]
reference:
  files:
    - path: kernel.wgsl
      content: |
        struct Dims { m: u32, k: u32, n: u32, _pad: u32 }

        @group(0) @binding(0) var<storage, read> a: array<f32>;
        @group(0) @binding(1) var<storage, read> b: array<f32>;
        @group(0) @binding(2) var<storage, read_write> c: array<f32>;
        @group(0) @binding(3) var<uniform> dims: Dims;

        const TILE: u32 = 16u;
        var<workgroup> tile_a: array<array<f32, 16>, 16>;
        var<workgroup> tile_b: array<array<f32, 16>, 16>;

        @compute @workgroup_size(16, 16)
        fn main(@builtin(global_invocation_id) gid: vec3<u32>,
                @builtin(local_invocation_id) lid: vec3<u32>) {
            let row = gid.y;
            let col = gid.x;
            var acc = 0.0;
            let tiles = (dims.k + TILE - 1u) / TILE;
            for (var t = 0u; t < tiles; t++) {
                let ak = t * TILE + lid.x;
                let bk = t * TILE + lid.y;
                var va = 0.0;
                if (row < dims.m && ak < dims.k) {
                    va = a[row * dims.k + ak];
                }
                var vb = 0.0;
                if (bk < dims.k && col < dims.n) {
                    vb = b[bk * dims.n + col];
                }
                tile_a[lid.y][lid.x] = va;
                tile_b[lid.y][lid.x] = vb;
                workgroupBarrier();
                for (var i = 0u; i < TILE; i++) {
                    acc += tile_a[lid.y][i] * tile_b[i][lid.x];
                }
                workgroupBarrier();
            }
            if (row < dims.m && col < dims.n) {
                c[row * dims.n + col] = acc;
            }
        }
