    from solution import group_anagrams, group_by_first_letter, net_counts, top_words


    class TestTopWords:
        def test_top_words_most_common_with_ties_by_first_occurrence(self):
            """The n most common words; ties keep first-appearance order."""
            assert top_words(["b", "a", "b", "a", "c"], 2) == [("b", 2), ("a", 2)]


    class TestGroupByFirstLetter:
        def test_group_by_first_letter(self):
            """Group words under their first character."""
            assert group_by_first_letter(["apple", "avocado", "banana"]) == {
                "a": ["apple", "avocado"], "b": ["banana"]
            }


    class TestGroupAnagrams:
        def test_group_anagrams_classic(self):
            """Anagrams share a group; first-seen order is preserved."""
            assert group_anagrams(["eat", "tea", "tan", "ate", "nat"]) == [
                ["eat", "tea", "ate"], ["tan", "nat"]
            ]


    class TestNetCounts:
        def test_net_counts_positive_margins_only(self):
            """Only positive nets: seen count minus blocked count."""
            assert net_counts(["x", "x", "x", "y"], ["x", "y"]) == {"x": 2}
- path: test_hidden.py
