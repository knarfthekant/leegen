track: python-data-structures
order: 5
environment: python
description: |
  Two `collections` types replace the most common dict boilerplate in coding
  questions. `Counter` counts things and answers "what are the top n?";
  `defaultdict(list)` groups things without the "is the key there yet?" dance.
  Together they are half of every frequency-based solution.

  ## Your task

  Implement four functions in `solution.py`.

  | Function | What it does |
  |---|---|
  | `top_words(words, n)` | The `n` most common words as `(word, count)` tuples. Ties come out in **first-occurrence order** (Counter preserves insertion order). |
  | `group_by_first_letter(words)` | Dict mapping first character -> list of words, in the order they appear. Case-sensitive: `"A"` and `"a"` are different keys. |
  | `group_anagrams(words)` | Group anagrams together; return the groups as a list of lists, each group in first-appearance order, groups in order of first appearance. |
  | `net_counts(upvotes, downvotes)` | For each element, margin = upvotes - downvotes. Return a plain dict of the elements with a **positive** margin, `{item: margin}`. |

  ## Worked example

  ```text
  top_words(["b", "a", "b", "a", "c"], 2)
      ->  [("b", 2), ("a", 2)]
  group_by_first_letter(["apple", "avocado", "banana"])
      ->  {"a": ["apple", "avocado"], "b": ["banana"]}
  group_anagrams(["eat", "tea", "tan", "ate", "nat"])
      ->  [["eat", "tea", "ate"], ["tan", "nat"]]
  net_counts(["x", "x", "x", "y"], ["x", "y"])
      ->  {"x": 2}        # "y" nets to zero and drops out
  ```

  ## Concepts these exercise

  - `Counter(words).most_common(n)` - the top-n idiom, no manual sort.
  - `defaultdict(list)` + `groups[key].append(item)` - grouping in two lines.
  - The anagram key: `tuple(sorted(word))` makes a hashable canonical form of
    any word, so anagrams collide into the same bucket.
  - `Counter(a) - Counter(b)` is multiset subtraction: counts that reach zero
    or go negative **disappear** from the result.

  :::details{summary="Why the anagram key works"}
  Anagrams are the same word rearranged, so sorting their characters gives the
  same sequence for all of them: `sorted("eat")`, `sorted("tea")` and
  `sorted("ate")` are all `['a', 'e', 't']`. A list can't be a dict key, so
  convert to `tuple` - the standard trick for making any derived value
  hashable.
  :::

  **Constraints:** at most 10**5 words; words are lowercase or uppercase
  ASCII. All functions run in O(n) (O(n k log k) for anagrams of length k).
hints:
- '`Counter(words).most_common(n)` returns exactly the `(word, count)` tuples asked for.'
- 'Grouping: `groups = defaultdict(list)` then `groups[fn(word)].append(word)`; `dict(groups)` converts
  back.'
- For anagrams the group key is `tuple(sorted(word))`. For net_counts, try `Counter(up) - Counter(down)`.
