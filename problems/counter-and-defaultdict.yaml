    from solution import group_anagrams, group_by_first_letter, net_counts, top_words


    class TestTopWords:
        def test_top_words_n_exceeds_distinct_words(self):
            """n larger than the vocabulary: every word, most common first."""
            assert top_words(["a", "b"], 10) == [("a", 1), ("b", 1)]

        def test_top_words_empty(self):
            """No words, no ranking."""
            assert top_words([], 3) == []

        def test_top_words_n_zero(self):
            """n = 0 asks for nothing."""
            assert top_words(["a"], 0) == []


    class TestGroupByFirstLetter:
        def test_group_by_first_letter_case_sensitive(self):
            """First letters are case-sensitive: A and a are different keys."""
            assert group_by_first_letter(["A", "a"]) == {"A": ["A"], "a": ["a"]}

        def test_group_by_first_letter_empty(self):
            """No words means no groups."""
            assert group_by_first_letter([]) == {}


    class TestGroupAnagrams:
        def test_group_anagrams_empty(self):
            """No words, no groups."""
            assert group_anagrams([]) == []

        def test_group_anagrams_no_anagrams_makes_singletons(self):
            """No anagram pairs: every word is a singleton group."""
            assert group_anagrams(["ab", "cd", "ef"]) == [["ab"], ["cd"], ["ef"]]

        def test_group_anagrams_identical_words_share_a_group(self):
            """Identical words share one group."""
            assert group_anagrams(["aa", "aa"]) == [["aa", "aa"]]


    class TestNetCounts:
        def test_net_counts_nothing_positive(self):
            """The blocked count cancels the seen count: {}."""
            assert net_counts(["x"], ["x", "x"]) == {}

        def test_net_counts_empty_inputs(self):
            """No input, no counts."""
            assert net_counts([], []) == {}

        def test_net_counts_margin_is_difference(self):
            """The value is the difference between seen and blocked."""
            assert net_counts(["x", "x", "x"], ["x"]) == {"x": 2}

        def test_net_counts_untouched_items_count_too(self):
            """Words only in the seen list still count."""
            assert net_counts(["y"], []) == {"y": 1}
reference:
  files:
  - path: solution.py
    content: |
      """Counter and defaultdict: counting and grouping without boilerplate."""

      from collections import Counter, defaultdict


      def top_words(words: list, n: int) -> list:
          return Counter(words).most_common(max(n, 0))


      def group_by_first_letter(words: list) -> dict:
          groups = defaultdict(list)
          for word in words:
              groups[word[0]].append(word)
          return dict(groups)


      def group_anagrams(words: list) -> list:
          groups = defaultdict(list)
          for word in words:
              groups[tuple(sorted(word))].append(word)
          return list(groups.values())


      def net_counts(upvotes: list, downvotes: list) -> dict:
          return dict(Counter(upvotes) - Counter(downvotes))
