        import asyncio
        from typing import AsyncIterable, AsyncIterator, Protocol, TypeVar

        T = TypeVar("T")


        class Connection(Protocol):
            async def readline(self) -> str | None: ...
            def close(self) -> None: ...


        async def countdown(n: int) -> AsyncIterator[int]:
            for i in range(n, 0, -1):
                await asyncio.sleep(0)
                yield i


        async def batched(stream: AsyncIterable[T], size: int) -> AsyncIterator[list[T]]:
            if size < 1:
                raise ValueError("size must be >= 1")
            batch: list[T] = []
            async for item in stream:
                batch.append(item)
                if len(batch) == size:
                    yield batch
                    batch = []
            if batch:
                yield batch


        async def read_lines(conn: Connection) -> AsyncIterator[str]:
            try:
                while (line := await conn.readline()) is not None:
                    line = line.strip()
                    if line:
                        yield line
            finally:
                conn.close()
