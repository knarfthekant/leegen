id: py-async-generators
title: Async Generators from Scratch
difficulty: intro
tags: [python, asyncio, generators]
track: python-fundamentals
order: 1
environment: python
requires: [cpu]
description: |
  An **async generator** is an `async def` function that contains `yield`. Calling it does not
  run any code yet. It returns an object you consume with `async for`, and between items it may
  `await` other things (network reads, sleeps, queues).

  ```python
  async def numbers():
      yield 1
      await asyncio.sleep(0.1)   # can await between items
      yield 2

  async for n in numbers():      # only valid inside another async function
      print(n)
  ```

  ```mermaid
  sequenceDiagram
      participant C as consumer (async for)
      participant G as async generator
      C->>G: __anext__()
      G-->>C: yield 1
      C->>G: __anext__()
      Note over G: await asyncio.sleep(...)
      G-->>C: yield 2
      C->>G: __anext__()
      G-->>C: StopAsyncIteration
  ```

  Implement three functions in `solution.py`.

  ### 1. `countdown(n)`
  Yield `n, n-1, ..., 1`, calling `await asyncio.sleep(0)` before each item so other tasks get a
  turn. `countdown(0)` yields nothing.

  ### 2. `batched(stream, size)`
  `stream` is any *async iterable*. Yield lists of up to `size` consecutive items. The last batch
  may be shorter. Raise `ValueError` if `size < 1`, but only once iteration starts (that is the
  natural behaviour of a generator, so you don't need anything special).

  ### 3. `read_lines(conn)`
  `conn` has `async def readline() -> str | None` (returns `None` at end of input) and a plain
  `close()` method. Yield each line with surrounding whitespace stripped, skipping empty lines.
  **`conn.close()` must be called exactly once**, whether the consumer reads everything, stops
  early with `break`, or an exception is raised.

  :::details{summary="What happens when the consumer breaks early?"}
  When an `async for` loop exits early, the generator is not resumed again. Python later calls
  its `aclose()` method, which raises `GeneratorExit` at the paused `yield`. Code in a
  `try/finally` around the `yield` still runs. Tests here call `aclose()` explicitly, the same
  way `contextlib.aclosing` does.
  :::

  `test_visible.py` shows some of the tests. More are hidden.
hints:
  - "`countdown`: a plain `for i in range(n, 0, -1)` loop with `await asyncio.sleep(0)` and `yield i` inside works."
  - "`batched`: keep a list, append each item from `async for`, and yield and reset it when it reaches `size`. Don't forget what's left at the end."
  - "`read_lines`: wrap the whole loop in `try: ... finally: conn.close()`."
