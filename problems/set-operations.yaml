description: |
  The **set** gives you O(1) membership tests and the whole vocabulary of
  intersection/difference as operators. In coding questions it shows up whenever
  a problem asks "which of these appear in both?", "have I seen this already?",
  or "can this requirement be satisfied?".

  ## Your task

  Implement four functions in `solution.py`.

  | Function | What it does |
  |---|---|
  | `common_tags(a, b)` | Sorted list of tags in **both** sets. |
  | `exclusive_tags(a, b)` | Sorted list of tags in **exactly one** of the two sets (symmetric difference). |
  | `covers(available, required)` | `True` if every required tag is available. `covers(x, set())` is `True`. |
  | `first_unique_order(items)` | Deduplicate `items` (a list), keeping the first occurrence of each element, in order. |

  ## Worked example

  ```text
  a = {"net", "db", "cache"}
  b = {"db", "queue"}

  common_tags(a, b)    ->  ["db"]
  exclusive_tags(a, b) ->  ["cache", "net", "queue"]
  covers(a, {"db", "net"})  ->  True
  covers(a, {"db", "ui"})   ->  False
  first_unique_order([3, 1, 3, 2, 1])  ->  [3, 1, 2]
  ```

  ## Concepts these exercise

  - Operators over method names: `a & b` (intersection), `a ^ b` (symmetric
    difference), `a - b` (difference), `required <= available` (subset test).
  - `sorted()` on a set gives you a deterministic list.
  - The dedupe idiom: a `seen` set for O(1) lookups plus an output list that
    preserves order - a set alone loses order.

  :::warning
  Membership in a set uses hashing: elements must be hashable (no lists or
  dicts as elements). That constraint is what buys the O(1) test.
  :::

  **Constraints:** at most 10**5 elements per input. All functions run in
  O(n) (plus the sort where a sorted result is required).
hints:
- Intersection is `a & b`, symmetric difference is `a ^ b` - the operators, not loops.
- 'Subset is an operator too: `required <= available`.'
- 'For dedupe, walk the list once: skip elements already in `seen`, otherwise add to both `seen` and the
  output.'
