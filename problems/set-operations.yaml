    from solution import common_tags, covers, exclusive_tags, first_unique_order


    class TestCommonTags:
        def test_common_tags_disjoint_sets(self):
            """No shared tags: the intersection is empty."""
            assert common_tags({1, 2}, {3, 4}) == []

        def test_common_tags_identical_sets(self):
            """Identical sets: the intersection is the whole set, sorted."""
            assert common_tags({1, 2}, {1, 2}) == [1, 2]

        def test_common_tags_empty(self):
            """An empty side intersects to nothing."""
            assert common_tags(set(), {1}) == []


    class TestExclusiveTags:
        def test_exclusive_tags_identical_sets_is_empty(self):
            """Identical sets cancel out: nothing is exclusive."""
            assert exclusive_tags({1, 2}, {1, 2}) == []

        def test_exclusive_tags_empty_side(self):
            """One side empty: everything on the other side is exclusive."""
            assert exclusive_tags(set(), {2, 1}) == [1, 2]


    class TestCovers:
        def test_covers_empty_required_is_true(self):
            """Nothing required is always covered."""
            assert covers({"db"}, set()) is True

        def test_covers_identical_sets(self):
            """A set covers itself."""
            assert covers({1, 2}, {1, 2}) is True

        def test_covers_empty_available_nonempty_required(self):
            """Nothing available cannot cover a requirement."""
            assert covers(set(), {1}) is False


    class TestFirstUniqueOrder:
        def test_first_unique_order_empty(self):
            """An empty list stays empty."""
            assert first_unique_order([]) == []

        def test_first_unique_order_all_duplicates(self):
            """All the same value: one copy survives."""
            assert first_unique_order([7, 7, 7]) == [7]

        def test_first_unique_order_strings(self):
            """Strings dedupe the same way numbers do."""
            assert first_unique_order(["b", "a", "b", "c"]) == ["b", "a", "c"]
reference:
  files:
  - path: solution.py
    content: |
      """Set operations: algebra, subset tests and order-preserving dedupe."""


      def common_tags(a: set, b: set) -> list:
          return sorted(a & b)


      def exclusive_tags(a: set, b: set) -> list:
          return sorted(a ^ b)


      def covers(available: set, required: set) -> bool:
          return required <= available


      def first_unique_order(items: list) -> list:
          seen = set()
          out = []
          for item in items:
              if item not in seen:
                  seen.add(item)
                  out.append(item)
          return out
