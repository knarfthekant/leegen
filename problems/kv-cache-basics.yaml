  - path: attention.py
    role: readonly
    content: |
      import math

      import torch


      def split_heads(x: torch.Tensor, n_heads: int) -> torch.Tensor:
          """[B, T, D] -> [B, H, T, D // H]"""
          b, t, d = x.shape
          return x.view(b, t, n_heads, d // n_heads).transpose(1, 2)


      def merge_heads(x: torch.Tensor) -> torch.Tensor:
          """[B, H, T, Dh] -> [B, T, H * Dh]"""
          b, h, t, dh = x.shape
          return x.transpose(1, 2).reshape(b, t, h * dh)


      def attend(q: torch.Tensor, k: torch.Tensor, v: torch.Tensor) -> torch.Tensor:
          """One decode step. q: [B, H, 1, Dh]; k, v: [B, H, T, Dh] -> [B, H, 1, Dh]"""
          if q.shape[-2] != 1:
              raise ValueError("attend() handles a single decode step: q must have length 1")
          scores = q @ k.transpose(-1, -2) / math.sqrt(q.shape[-1])
          return torch.softmax(scores, dim=-1) @ v
  - path: _setup.py
    role: hidden
    content: |
      import torch

      from leetclaude_harness import device


      def make_inputs(seed: int, B: int, T: int, D: int, H: int):
          g = torch.Generator().manual_seed(seed)
          dev = device()
          scale = D ** -0.5

          def rand(*shape, s=1.0):
              return (torch.randn(*shape, generator=g) * s).to(dev)

          return {"x": rand(B, T, D), "w_q": rand(D, D, s=scale), "w_k": rand(D, D, s=scale),
                  "w_v": rand(D, D, s=scale), "n_heads": H}


      def full_causal_attention(x, w_q, w_k, w_v, n_heads):
          """Independent check used while authoring: non-cached causal attention."""
          b, t, d = x.shape
          q, k, v = (m.view(b, t, n_heads, d // n_heads).transpose(1, 2)
                     for m in (x @ w_q, x @ w_k, x @ w_v))
          mask = torch.ones(t, t, dtype=torch.bool, device=x.device).tril()
          scores = (q @ k.transpose(-1, -2)) / (d // n_heads) ** 0.5
          scores = scores.masked_fill(~mask, float("-inf"))
          out = torch.softmax(scores, -1) @ v
          return out.transpose(1, 2).reshape(b, t, d)
reference:
  files:
    - path: solution.py
      content: |
        import torch

        from attention import attend, merge_heads, split_heads


        class KVCache:
            def __init__(self, batch: int, n_heads: int, max_len: int, head_dim: int, *,
                         device: torch.device, dtype: torch.dtype = torch.float32) -> None:
                shape = (batch, n_heads, max_len, head_dim)
                self.k = torch.zeros(shape, device=device, dtype=dtype)
                self.v = torch.zeros(shape, device=device, dtype=dtype)
                self.max_len = max_len
                self.length = 0

            def append(self, k: torch.Tensor, v: torch.Tensor) -> None:
                t_new = k.shape[-2]
                if self.length + t_new > self.max_len:
                    raise ValueError("KV cache overflow")
                self.k[:, :, self.length:self.length + t_new] = k
                self.v[:, :, self.length:self.length + t_new] = v
                self.length += t_new

            def get(self) -> tuple[torch.Tensor, torch.Tensor]:
                return self.k[:, :, :self.length], self.v[:, :, :self.length]

            def __len__(self) -> int:
                return self.length


        def decode_with_cache(x: torch.Tensor, w_q: torch.Tensor, w_k: torch.Tensor,
                              w_v: torch.Tensor, n_heads: int) -> torch.Tensor:
            b, t, d = x.shape
            cache = KVCache(b, n_heads, t, d // n_heads, device=x.device, dtype=x.dtype)
            outs = []
            for i in range(t):
                x_t = x[:, i:i + 1]
                q = split_heads(x_t @ w_q, n_heads)
                cache.append(split_heads(x_t @ w_k, n_heads), split_heads(x_t @ w_v, n_heads))
                outs.append(merge_heads(attend(q, *cache.get())))
            return torch.cat(outs, dim=1)
