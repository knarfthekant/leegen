schema_version: 1
id: kv-cache-basics
title: Decode with a KV Cache
difficulty: medium
tags: [pytorch, attention, transformers, inference]
track: ml-fundamentals
order: 1
environment: pytorch
requires: [gpu]
description: |
  An autoregressive transformer generates one token at a time. At step $t$ the new token's
  query attends to the keys and values of **every** position $0..t$. Recomputing $K$ and $V$
  for the whole prefix at every step repeats work: step $t$ re-projects $t$ old tokens.

  A **KV cache** stores each position's key and value the first time they're computed. Each
  decode step then projects only the new token, appends its $k, v$ to the cache, and attends
  over the cached tensors.

  ```mermaid
  flowchart LR
      x["x_t (new token)"] --> P["project: q_t, k_t, v_t"]
      P -->|append k_t, v_t| C[("KV cache<br/>[B, H, t+1, Dh]")]
      P -->|q_t| A["attend(q_t, K, V)"]
      C -->|K, V| A
      A --> o[o_t]
  ```

  For one head with head size $d_h$:

  $$o_t = \operatorname{softmax}\!\left(\frac{q_t K_{0..t}^\top}{\sqrt{d_h}}\right) V_{0..t}$$

  ### Your task

  In `solution.py`:

  1. **`KVCache`** preallocates key and value buffers of shape
     `[batch, n_heads, max_len, head_dim]` on the given device.
     - `append(k, v)` writes `t_new` new positions (`k`, `v` are `[batch, n_heads, t_new, head_dim]`)
       and raises `ValueError` if the cache would go past `max_len`.
     - `get()` returns `(k, v)` for the positions written so far. Return slices of the buffers
       (views), not copies.
     - `len(cache)` is the number of positions written so far.
  2. **`decode_with_cache(x, w_q, w_k, w_v, n_heads)`** processes `x` (`[B, T, D]`) **one
     position at a time**, using a `KVCache` and the read-only helpers in `attention.py`. It
     returns the attention output `[B, T, D]`, where row $t$ attends to positions $0..t$
     (causal). Projections are `x @ w_q`, `x @ w_k`, `x @ w_v`, each with weight shape `[D, D]`.

  :::note
  `attend()` only accepts a single query position, so a full-sequence shortcut won't work.
  Tests run on the selected device (`mps` on Apple silicon, `cuda` on NVIDIA). Keep every tensor
  on `x.device`.
  :::

  :::details{summary="Why preallocate?"}
  Growing the cache with `torch.cat` at every step allocates a new tensor and copies the whole
  prefix each time, which is $O(T^2)$ memory traffic. Writing into a preallocated buffer keeps
  each step $O(1)$ apart from the attention itself. Real inference engines go further and page
  the cache into fixed-size blocks.
  :::
hints:
  - "In `__init__`: `self.k = torch.zeros(batch, n_heads, max_len, head_dim, device=device, dtype=dtype)`, the same for `v`, and `self.length = 0`."
  - "`append`: `self.k[:, :, self.length:self.length + t_new] = k`, then advance `self.length`."
  - "Decode loop: `x_t = x[:, t:t+1]` keeps the time dimension. Project it, `split_heads`, append, `attend`, `merge_heads`, then collect the outputs and `torch.cat` them along dim 1."
