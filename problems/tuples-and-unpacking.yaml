    from solution import first_last, minmax, senior_pay, transpose


    class TestTranspose:
        def test_transpose_empty(self):
            """No rows means no columns."""
            assert transpose([]) == []

        def test_transpose_ragged_rows_truncate_to_shortest(self):
            """Ragged rows truncate to the shortest row."""
            assert transpose([[1, 2, 3], [4, 5]]) == [[1, 4], [2, 5]]

        def test_transpose_single_row(self):
            """One row transposes into one-element columns."""
            assert transpose([[1, 2, 3]]) == [[1], [2], [3]]


    class TestMinmax:
        def test_minmax_single_element(self):
            """One element is both extremes."""
            assert minmax([5]) == (5, 5)

        def test_minmax_empty(self):
            """No elements means (None, None)."""
            assert minmax([]) == (None, None)

        def test_minmax_negative_numbers(self):
            """Negative numbers sort normally."""
            assert minmax([-3, -1, -7]) == (-7, -1)


    class TestSeniorPay:
        def test_senior_pay_empty_employees(self):
            """No employees pay nothing."""
            assert senior_pay([], 5) == 0

        def test_senior_pay_nobody_qualifies(self):
            """Everyone below the threshold sums to 0."""
            assert senior_pay([("bob", 80, 2)], 5) == 0

        def test_senior_pay_everyone_qualifies(self):
            """A zero threshold includes everyone."""
            assert senior_pay([("a", 10, 1), ("b", 20, 2)], 0) == 30


    class TestFirstLast:
        def test_first_last_empty(self):
            """No elements means (None, None)."""
            assert first_last([]) == (None, None)

        def test_first_last_single_element_is_both(self):
            """One element is both ends."""
            assert first_last(["x"]) == ("x", "x")

        def test_first_last_two_elements(self):
            """Two elements are the ends."""
            assert first_last([1, 2]) == (1, 2)
reference:
  files:
  - path: solution.py
    content: |
      """Tuples and the unpacking toolkit: zip, enumerate, star unpacking."""


      def transpose(rows: list) -> list:
          if not rows:
              return []
          return [list(col) for col in zip(*rows)]


      def minmax(nums: list) -> tuple:
          if not nums:
              return (None, None)
          return (min(nums), max(nums))


      def senior_pay(employees: list, min_years: int) -> int:
          total = 0
          for _name, salary, years in employees:
              if years >= min_years:
                  total += salary
          return total


      def first_last(items: list) -> tuple:
          if not items:
              return (None, None)
          if len(items) == 1:
              only = items[0]
              return (only, only)
          first, *_middle, last = items
          return (first, last)
