    from solution import first_last, minmax, senior_pay, transpose


    class TestTranspose:
        def test_transpose_swaps_rows_and_columns(self):
            """Zip the rows so columns become rows."""
            assert transpose([[1, 2, 3], [4, 5, 6]]) == [[1, 4], [2, 5], [3, 6]]


    class TestMinmax:
        def test_minmax_returns_both_extremes(self):
            """One pass returns (smallest, largest)."""
            assert minmax([4, 1, 9, 3]) == (1, 9)


