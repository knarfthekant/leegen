        def test_senior_pay_unpacks_records_in_the_loop(self):
            """Sum pay for employees whose years meet the threshold."""
            employees = [("ada", 100, 6), ("bob", 80, 2), ("cy", 50, 9)]
            assert senior_pay(employees, 5) == 150


