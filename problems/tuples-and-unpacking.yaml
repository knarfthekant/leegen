description: |
  Tuples are Python's make-a-record type, and the pairing operations around them -
  `zip`, `enumerate`, star unpacking - are what make Python loops look like data
  transformation instead of index bookkeeping. Design questions assume you can
  juggle `(key, value)` pairs without friction.

  ## Your task

  Implement four functions in `solution.py`.

  | Function | What it does |
  |---|---|
  | `transpose(rows)` | `rows` is a list of lists. Return the columns as a list of lists. Truncates to the shortest row if they are ragged. `transpose([])` is `[]`. |
  | `minmax(nums)` | Return a tuple `(smallest, largest)`; `(None, None)` for an empty list. |
  | `senior_pay(employees, min_years)` | `employees` is a list of `(name, salary, years)` tuples. Return the total salary of employees with `years >= min_years`. Unpack in the loop. |
  | `first_last(items)` | Return `(first, last)` using star unpacking. `(None, None)` for an empty list; a single element is `(x, x)`. |

  ## Worked example

  ```text
  transpose([[1, 2, 3], [4, 5, 6]])  ->  [[1, 4], [2, 5], [3, 6]]
  minmax([4, 1, 9, 3])               ->  (1, 9)
  senior_pay([("ada", 100, 6), ("bob", 80, 2)], 5)  ->  100
  first_last(["a", "b", "c"])        ->  ("a", "c")
  ```

  ## Concepts these exercise

  - `zip(*rows)` transposes in one call: the star spreads rows as separate
    arguments, `zip` re-groups by position.
  - `for name, salary, years in employees` unpacks each record in the loop
    header - no `row[1]` indexing.
  - `first, *middle, last = items` grabs both ends in one statement - but a
    two-target star unpack needs at least two elements, so the one-element
    case needs its own guard.
  - Returning a tuple `(min, max)` is the idiomatic multi-value return;
    callers unpack it.

  :::note
  `zip` stops at the shortest input. That is the documented truncation behaviour
  `transpose` must preserve for ragged rows - and `itertools.zip_longest` is
  what you would reach for if you needed padding instead.
  :::

  **Constraints:** at most 10**5 rows/elements; salaries fit in a 64-bit int.
  Every function runs in O(n).
hints:
- Transpose is `[list(col) for col in zip(*rows)]` - the star is doing the unpacking of arguments.
- 'In `senior_pay`, unpack in the loop header: `for name, salary, years in employees:`.'
- '`first, *middle, last = items` binds both ends at once - but it needs at least two elements, so handle
  `len(items) == 1` before it.'
