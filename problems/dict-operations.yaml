id: dict-operations
title: 'Dicts: Lookups, Counting, and Reshaping'
difficulty: intro
tags:
- python
- dicts
- hashing
track: python-data-structures
order: 2
environment: python
description: |
  The **dict** is the structure you will reach for in half of all coding questions:
  O(1) lookups turn "have I seen X?" from a scan into a hash. This problem drills
  the operations that matter - safe lookups, counting, inversion, merging, and
  sorting by value.

  ## Your task

  Implement four functions in `solution.py`. None of them may mutate their inputs.

  | Function | What it does |
  |---|---|
  | `tally(words)` | Count occurrences of each word. `tally([])` is `{}`. |
  | `invert(mapping)` | Swap keys and values: `{v: k for ...}`. If two keys share a value, the **later** key wins. |
  | `merge(base, override)` | A new dict with all keys of both; `override`'s value wins on conflicts. Neither input changes. |
  | `ranked(scores)` | `scores` maps name -> score. Return a list of `(name, score)` tuples, highest score first, ties broken by name in alphabetical order. |

  ## Worked example

  ```text
  tally(["a", "b", "a"])                  ->  {"a": 2, "b": 1}
  invert({"x": 1, "y": 2})                ->  {1: "x", 2: "y"}
  merge({"a": 1, "b": 2}, {"b": 9})       ->  {"a": 1, "b": 9}
  ranked({"ada": 90, "grace": 99, "linus": 90})
                                          ->  [("grace", 99), ("ada", 90), ("linus", 90)]
  ```

  ## Concepts these exercise

  - `counts.get(word, 0) + 1` counts without a KeyError; `setdefault` and
    `collections.defaultdict` are the other two idioms for the same job.
  - Dict comprehensions rebuild a dict in one expression.
  - `{**base, **override}` (or `base | override` in 3.9+) merges without
    mutating either side - the later dict wins.
  - Sorting a dict by value uses `key=lambda kv: (-kv[1], kv[0])`: negate the
    value for descending, keep the key ascending for the tiebreak.

  :::warning
  `ranked` sorts tuples. Python compares tuples element by element, so
  `(-score, name)` sorts scores descending and names ascending in one key -
  no two-pass sort needed.
  :::

  **Constraints:** every input has at most 10**5 entries; scores fit in a
  64-bit int. All functions run in O(n log n) or better.
hints:
- 'Counting without KeyError: `counts[w] = counts.get(w, 0) + 1`.'
- '`invert` is a one-line dict comprehension. Watch which side of the comprehension is the key.'
- 'For `ranked`, sort `scores.items()` with `key=lambda kv: (-kv[1], kv[0])`.'
