    from solution import invert, merge, ranked, tally


    class TestTally:
        def test_tally_counts_each_word(self):
            """Count each word: duplicates add up."""
            assert tally(["a", "b", "a"]) == {"a": 2, "b": 1}


    class TestInvert:
        def test_invert_swaps_keys_and_values(self):
            """Swap keys and values: each value becomes the key."""
            assert invert({"x": 1, "y": 2}) == {1: "x", 2: "y"}


    class TestMerge:
        def test_merge_override_wins_on_conflict(self):
            """Both dicts' keys survive; override wins on the shared key."""
            assert merge({"a": 1, "b": 2}, {"b": 9}) == {"a": 1, "b": 9}


    class TestRanked:
        def test_ranked_ties_break_alphabetically(self):
            """Highest score first; equal scores sort by name."""
            assert ranked({"ada": 90, "grace": 99, "linus": 90}) == [
                ("grace", 99), ("ada", 90), ("linus", 90)
            ]
- path: test_hidden.py
  role: hidden
  content: |
    from solution import invert, merge, ranked, tally


    class TestTally:
        def test_tally_empty_list(self):
            """An empty list has no counts: return {}."""
            assert tally([]) == {}

        def test_tally_single_word(self):
            """One word counts once."""
            assert tally(["solo"]) == {"solo": 1}


    class TestInvert:
        def test_invert_duplicate_values_later_key_wins(self):
            """Two keys share a value: the later key wins."""
            assert invert({"first": 1, "second": 1}) == {1: "second"}

        def test_invert_empty_dict(self):
            """An empty dict inverts to an empty dict."""
            assert invert({}) == {}


    class TestMerge:
        def test_merge_neither_input_is_mutated(self):
            """The result is new; neither input dict changes."""
            base = {"a": 1}
            override = {"b": 2}
            result = merge(base, override)
            assert result == {"a": 1, "b": 2}
            assert base == {"a": 1}
            assert override == {"b": 2}

        def test_merge_empty_override_returns_copy_of_base(self):
            """An empty override still returns a new dict, not base itself."""
            base = {"a": 1}
            result = merge(base, {})
            assert result == {"a": 1}
            assert result is not base


    class TestRanked:
        def test_ranked_empty_dict(self):
            """No scores means an empty ranking."""
            assert ranked({}) == []

        def test_ranked_negative_scores_sort_correctly(self):
            """Negative scores still sort highest first."""
            assert ranked({"a": -1, "b": -5}) == [("a", -1), ("b", -5)]

        def test_ranked_single_entry(self):
            """One entry is its own ranking."""
            assert ranked({"solo": 7}) == [("solo", 7)]


    class TestNoMutation:
        def test_functions_do_not_mutate_their_inputs(self):
            """Every function leaves its input dict unchanged."""
            scores = {"a": 1, "b": 2}
            mapping = {"x": 1}
            ranked(scores)
            invert(mapping)
            tally(list(scores))
            assert scores == {"a": 1, "b": 2}
            assert mapping == {"x": 1}
reference:
  files:
  - path: solution.py
    content: |
      """Dict operations: safe lookups, counting, inversion, merging, ranking."""


      def tally(words: list) -> dict:
          counts = {}
          for word in words:
              counts[word] = counts.get(word, 0) + 1
          return counts


      def invert(mapping: dict) -> dict:
          return {value: key for key, value in mapping.items()}


      def merge(base: dict, override: dict) -> dict:
          return {**base, **override}


      def ranked(scores: dict) -> list:
          return sorted(scores.items(), key=lambda kv: (-kv[1], kv[0]))
