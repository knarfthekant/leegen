    import pytest

    from solution import chunk, keep_truthy, rotate, top_scores


    class TestRotate:
        def test_rotate_empty_list(self):
            """An empty list has nothing to rotate: return []."""
            assert rotate([], 3) == []

        def test_rotate_k_larger_than_length_wraps_around(self):
            """k larger than the list wraps: rotating 3 items by 7 is rotating by 1."""
            assert rotate([1, 2, 3], 7) == [3, 1, 2]

        def test_rotate_zero_returns_a_copy(self):
            """k = 0 returns a new list in the same order, not the input object."""
            src = [1, 2]
            out = rotate(src, 0)
            assert out == [1, 2]
            assert out is not src

        def test_rotate_negative_k_rotates_left(self):
            """A negative k rotates left: -1 moves the first element to the end."""
            assert rotate([1, 2, 3, 4], -1) == [2, 3, 4, 1]


    class TestChunk:
        def test_chunk_size_larger_than_list_makes_one_chunk(self):
            """size larger than the list: one chunk holds everything."""
            assert chunk([1, 2], 10) == [[1, 2]]

        def test_chunk_size_zero_raises_value_error(self):
            """size <= 0 is invalid: raise ValueError."""
            with pytest.raises(ValueError):
                chunk([1], 0)

        def test_chunk_empty_list(self):
            """An empty list has no chunks: return []."""
            assert chunk([], 3) == []


    class TestTopScores:
        def test_top_scores_k_bigger_than_list_returns_all_sorted(self):
            """k larger than the list: return every score, highest first."""
            assert top_scores([3, 1], 10) == [3, 1]

        def test_top_scores_all_ties(self):
            """Ties count separately: two 5s are both returned for k = 2."""
            assert top_scores([5, 5, 5], 2) == [5, 5]

        def test_top_scores_empty_list(self):
            """An empty score list has no top scores: return []."""
            assert top_scores([], 3) == []

        def test_top_scores_k_zero_or_negative(self):
            """k <= 0 asks for nothing: return []."""
            assert top_scores([9, 8], 0) == []
            assert top_scores([9, 8], -3) == []


    class TestKeepTruthy:
        def test_keep_truthy_empty_list(self):
            """An empty list stays empty."""
            assert keep_truthy([]) == []

        def test_keep_truthy_all_falsy(self):
            """Only falsy values: nothing survives."""
            assert keep_truthy([0, "", None, [], {}]) == []


    class TestNoMutation:
        def test_functions_do_not_mutate_their_input(self):
            """Every function returns a new list; the input stays unchanged."""
            src = [3, 1, 2]
            rotate(src, 1)
            top_scores(src, 2)
            keep_truthy(src)
            chunk(src, 2)
            assert src == [3, 1, 2]
reference:
  files:
  - path: solution.py
    content: |
      """List operations: slicing, sorting and reshaping."""


      def rotate(items: list, k: int) -> list:
          if not items:
              return []
          n = len(items)
          k %= n
          return items[n - k:] + items[:n - k]


      def chunk(items: list, size: int) -> list:
          if size <= 0:
              raise ValueError("size must be positive")
          return [items[i:i + size] for i in range(0, len(items), size)]


      def top_scores(scores: list, k: int) -> list:
          return sorted(scores, reverse=True)[:max(k, 0)]


      def keep_truthy(items: list) -> list:
          return [x for x in items if x]
