[project]
name = "leetclaude"
version = "1.2.0"
description = "AI-native programming training app"
authors = [
    { name = "Frank Shan", email = "frank.shan@cresta.ai" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
leetclaude = "leetclaude.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
