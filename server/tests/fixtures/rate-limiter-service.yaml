  - path: app/service.py
    role: readonly
    content: |
      from dataclasses import dataclass, field

      from app.limiter import TokenBucketLimiter

      ROUTE_COST = {"/export": 5.0}


      @dataclass
      class Request:
          path: str
          client_ip: str
          api_key: str | None = None


      @dataclass
      class Response:
          status: int
          body: str = ""
          headers: dict[str, str] = field(default_factory=dict)


      class ApiService:
          def __init__(self, limiter: TokenBucketLimiter) -> None:
              self.limiter = limiter

          def handle(self, req: Request) -> Response:
              key = f"key:{req.api_key}" if req.api_key else f"ip:{req.client_ip}"
              decision = self.limiter.check(key, ROUTE_COST.get(req.path, 1.0))
              if not decision.allowed:
                  return Response(429, "rate limited",
                                  {"Retry-After": f"{decision.retry_after:.3f}"})
              return Response(200, f"ok {req.path}")
  - path: test_service.py
    role: readonly
    content: |
      from app.clock import FakeClock
      from app.limiter import TokenBucketLimiter
      from app.service import ApiService, Request


      def make(capacity=3, rate=1.0):
          clock = FakeClock()
          return clock, ApiService(TokenBucketLimiter(capacity, rate, clock))


      def test_allows_up_to_capacity():
          """a new client can make `capacity` requests at once"""
          _, svc = make()
          assert [svc.handle(Request("/", "1.1.1.1")).status for _ in range(3)] == [200] * 3


      def test_denies_when_empty():
          """the next request gets 429 and a Retry-After header"""
          _, svc = make()
          for _ in range(3):
              svc.handle(Request("/", "1.1.1.1"))
          res = svc.handle(Request("/", "1.1.1.1"))
          assert res.status == 429
          assert float(res.headers["Retry-After"]) == 1.0


      def test_refills_over_time():
          """waiting one second refills one token"""
          clock, svc = make()
          for _ in range(3):
              svc.handle(Request("/", "1.1.1.1"))
          clock.advance(1.0)
          assert svc.handle(Request("/", "1.1.1.1")).status == 200
  - path: test_hidden.py
    role: hidden
    content: |
      import pytest

      from app.clock import FakeClock
      from app.limiter import TokenBucketLimiter
      from app.service import ApiService, Request


      def make(capacity=3, rate=1.0):
          clock = FakeClock()
          return clock, TokenBucketLimiter(capacity, rate, clock)


      def test_keys_are_independent():
          """one client's usage doesn't affect another"""
          _, lim = make(capacity=1)
          assert lim.check("a").allowed
          assert not lim.check("a").allowed
          assert lim.check("b").allowed


      def test_fractional_refill():
          """half a second at 1 token/s is not enough for one more request"""
          clock, lim = make(capacity=1)
          lim.check("a")
          clock.advance(0.5)
          d = lim.check("a")
          assert not d.allowed
          assert d.retry_after == pytest.approx(0.5)


      def test_denied_requests_do_not_consume():
          """a denied request leaves the bucket unchanged"""
          clock, lim = make(capacity=2, rate=1.0)
          lim.check("a", 2)
          clock.advance(1.0)
          assert not lim.check("a", 2).allowed
          clock.advance(1.0)
          assert lim.check("a", 2).allowed


      def test_never_exceeds_capacity():
          """a long idle period doesn't overfill the bucket"""
          clock, lim = make(capacity=3)
          clock.advance(1000)
          results = [lim.check("a").allowed for _ in range(4)]
          assert results == [True, True, True, False]


      def test_cost_above_capacity_raises():
          """a cost larger than capacity is a ValueError"""
          _, lim = make(capacity=3)
          with pytest.raises(ValueError):
              lim.check("a", 4)


      def test_export_route_costs_five():
          """/export uses 5 tokens; api keys are bucketed separately from IPs"""
          clock = FakeClock()
          svc = ApiService(TokenBucketLimiter(10, 2.0, clock))
          assert svc.handle(Request("/export", "9.9.9.9", api_key="k")).status == 200
          assert svc.handle(Request("/export", "9.9.9.9", api_key="k")).status == 200
          res = svc.handle(Request("/export", "9.9.9.9", api_key="k"))
          assert res.status == 429
          assert float(res.headers["Retry-After"]) == pytest.approx(2.5)
          assert svc.handle(Request("/", "9.9.9.9")).status == 200
reference:
  files:
    - path: app/limiter.py
      content: |
        from dataclasses import dataclass

        from app.clock import Clock


        @dataclass(frozen=True)
        class Decision:
            allowed: bool
            retry_after: float = 0.0


        class TokenBucketLimiter:
            def __init__(self, capacity: float, refill_per_sec: float, clock: Clock) -> None:
                self.capacity = capacity
                self.refill_per_sec = refill_per_sec
                self.clock = clock
                self._buckets: dict[str, tuple[float, float]] = {}

            def check(self, key: str, cost: float = 1.0) -> Decision:
                if cost > self.capacity:
                    raise ValueError("cost exceeds bucket capacity")
                now = self.clock.now()
                tokens, last = self._buckets.get(key, (self.capacity, now))
                tokens = min(self.capacity, tokens + (now - last) * self.refill_per_sec)
                if tokens >= cost:
                    self._buckets[key] = (tokens - cost, now)
                    return Decision(True, 0.0)
                self._buckets[key] = (tokens, now)
                return Decision(False, (cost - tokens) / self.refill_per_sec)
