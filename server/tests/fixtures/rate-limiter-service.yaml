schema_version: 1
id: rate-limiter-service
title: Finish the API Rate Limiter
difficulty: medium
tags: [python, system-design, application]
environment: python
requires: [cpu]
description: |
  You joined a team whose small HTTP-style API service is almost done. The request handler,
  clock and response types are written and **read-only**. What's missing is the rate limiter in
  `app/limiter.py`.

  ```mermaid
  flowchart LR
      R[Request] --> S[ApiService.handle]
      S -->|key = api_key or client_ip| L[TokenBucketLimiter.check]
      L -->|allowed| H[route handler] --> OK[200]
      L -->|denied| TM[429 + Retry-After]
  ```

  ### The token bucket

  Each key (an API key or a client IP) has a bucket holding at most `capacity` tokens. A new key
  starts with a **full** bucket. Tokens refill continuously at `refill_per_sec`. That means
  fractional tokens accumulate, but the bucket never goes above `capacity`. Each request costs
  `cost` tokens (default 1).

  - If the bucket has at least `cost` tokens, take them. The request is **allowed** and
    `retry_after` is `0.0`.
  - Otherwise nothing is taken. The request is **denied** and `retry_after` is the number of
    seconds until enough tokens will exist:

  $$\text{retry\_after} = \frac{\text{cost} - \text{tokens}}{\text{refill\_per\_sec}}$$

  - If `cost > capacity`, the request can never succeed. Raise `ValueError`.

  Time comes from the injected `clock` (`clock.now()` returns seconds as a float). Never call
  `time.time()` directly, because the tests use a fake clock.

  :::warning
  Buckets for different keys are independent. Read `app/service.py` to see how keys and
  per-route costs are chosen. The `/export` route costs 5 tokens.
  :::

  `test_service.py` holds the team's existing tests. Hidden tests check refill math, isolation
  between keys, and edge cases.
hints:
  - Store `(tokens, last_seen_time)` per key in a dict.
  - "On each check: `tokens = min(capacity, tokens + (now - last) * refill_per_sec)`, then update `last = now` before deciding."
  - Only subtract when allowed. A denied request must not use up tokens.
files:
  - path: app/__init__.py
    role: readonly
    content: ""
  - path: app/clock.py
    role: readonly
    content: |
      import time
      from typing import Protocol


      class Clock(Protocol):
          def now(self) -> float: ...


      class SystemClock:
          def now(self) -> float:
              return time.monotonic()


      class FakeClock:
          """Manually advanced clock used in tests."""

          def __init__(self, start: float = 1000.0) -> None:
              self._now = start

          def now(self) -> float:
              return self._now

          def advance(self, seconds: float) -> None:
              self._now += seconds
